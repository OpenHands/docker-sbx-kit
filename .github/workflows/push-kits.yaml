name: Publish Kits

on:
  # Auto-publish whenever kit content lands on main, so Docker Hub always tracks
  # the default branch. Path-filtered so unrelated changes (assets, other CI,
  # LICENSE-only) don't trigger a republish.
  push:
    branches: [main]
    paths:
      - "spec.yaml"
      # v3 kit (built and pushed alongside the v2 spec)
      - "openhands.yaml"
      - "openhands.dockerfile"
      - "openhands-context.md"
      - "kits/**"
      - "files/**"
      - "providers/**"
      - "scripts/push-kits.sh"
      - "README.md"
      - "DOCKERHUB.md"
      - ".github/workflows/push-kits.yaml"
  workflow_dispatch:
    inputs:
      sbx_release:
        description: "docker/sbx-releases tag to install (must support schemaVersion 2 kits)"
        required: true
        default: "v0.39.0-rc5"
      tag:
        description: "OCI tag to publish for the default (anthropic) kit"
        required: false
        default: "latest"

jobs:
  publish-kit:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install SBX
        env:
          GH_TOKEN: ${{ github.token }}
          # push events have no inputs — fall back to a v2-capable default.
          SBX_RELEASE: ${{ inputs.sbx_release || 'v0.39.0-rc5' }}
        run: |
          set -euo pipefail
          gh release download "$SBX_RELEASE" \
            --repo docker/sbx-releases \
            --pattern 'DockerSandboxes-linux-amd64-ubuntu2404.deb' \
            --output /tmp/docker-sandboxes.deb
          sudo apt-get update
          sudo apt-get install -y /tmp/docker-sandboxes.deb
          sbx version
          # sbx login (below) stores its account profile via the daemon, so it
          # must be running. --detach keeps it from blocking the step.
          sbx daemon start --detach
          for _ in $(seq 1 30); do
            sbx daemon status 2>/dev/null | grep -q 'running' && break
            sleep 1
          done
          sbx daemon status

      - name: Log in to Docker Hub
        # Populates the Docker credential store — used for the kit's OCI layer
        # push (`sbx kit push` reads the Docker credential store).
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Authenticate sbx to Docker Hub
        # `sbx kit push` also writes an OCI provenance blob, which is
        # authenticated via sbx's OWN account profile (from `sbx login`), NOT the
        # Docker credential store. Without this the layer push succeeds but the
        # provenance push fails with "no default account profile set" (the first
        # tag may get partway, later tags hard-fail).
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: printf '%s' "$DOCKERHUB_TOKEN" | sbx login --username "$DOCKERHUB_USERNAME" --password-stdin

      - name: Publish kit artifact
        env:
          DOCKERHUB_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}
          TAG: ${{ inputs.tag || 'latest' }}
        run: bash ./scripts/push-kits.sh

      # --- v3 kit, built and pushed alongside the v2 spec ---
      # The kit frontend is pulled automatically from openhands.yaml's
      # `# syntax=docker/sandbox-kit:3` line, so nothing extra is installed.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Publish v3 kit
        # Distinct :v3 tags so the v3 artifact never overwrites the v2 :latest
        # the step above pushes. The Docker Hub login above authenticates the
        # buildx --push.
        env:
          DOCKERHUB_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          image="docker.io/${DOCKERHUB_NAMESPACE}/sbx-openhands-kits"
          version="$(sed -n 's/^version: *"\{0,1\}\([^"]*\)"\{0,1\}/\1/p' openhands.yaml | head -n1)"
          version="${version:-1.0.0}"
          docker buildx build . -f openhands.yaml \
            --platform linux/amd64,linux/arm64 \
            --provenance=true \
            --push \
            -t "$image:v3" \
            -t "$image:v3-$version"
          echo "Pushed $image:v3 and $image:v3-$version"

      - name: Sync Docker Hub overview page
        # Cosmetic: updates the Hub repo's overview README from DOCKERHUB.md.
        # `if: always()` decouples it from the kit push so the page still syncs
        # even if a push flakes; `continue-on-error` keeps a DOCKERHUB_TOKEN
        # whose scope doesn't include this repo (Docker Hub returns 404, not 403)
        # from failing the run. To make it actually update, use a PAT scoped to
        # <namespace>/sbx-openhands-kits with read/write.
        if: ${{ always() }}
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/sbx-openhands-kits
          readme-filepath: ./DOCKERHUB.md
          short-description: "Docker Sandboxes mixin adding OpenHands Agent Canvas + headless runner (anthropic, openai, dmr)"
